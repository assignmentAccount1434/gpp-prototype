{% extends "recruitment/base.html" %}

{% block content %}
<h1 class="text-3xl font-bold">{{ title }}</h1>

{% if problem %}
<p role="alert">{{ problem }}</p>
{% endif %}

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{{ title }}</button>
</form>

<p>
  <a href="{% url 'signin' %}">Sign in</a>
  or
  <a href="{% url 'signup' %}">create an account</a>.
</p>
{% endblock %}
